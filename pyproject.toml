[project]
name = "jobseeker"
version = "1.0.0"
description = "Jobseeker — a personal job-search pipeline: fetch, triage, tailor, gate, track; the human applies by hand."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typst",
    "pyyaml",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
