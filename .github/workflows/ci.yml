name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ruff is pinned deliberately. pyproject.toml selects no explicit rule
      # list, so ruff's DEFAULT set applies, and that set grows with each
      # release. An unpinned `pip install ruff` therefore means a lint step
      # that passes today and fails tomorrow because someone else shipped a
      # release, on a PR that changed nothing related.
      #
      # 0.15.22 is the newest release this tree is clean under. 0.16.0 widened
      # the defaults and reports 57 findings here (I001, RUF100, UP017, SIM115,
      # PLW1510 and friends). Bumping the pin is fine, but do it deliberately,
      # in a commit that also carries the fixes for whatever the new version
      # flags.
      - name: Install dependencies
        run: pip install pyyaml httpx pydantic pytest 'ruff==0.15.22'
      - name: Lint
        run: ruff check bin/ tests/
      - name: Acceptance tests
        run: python3 -m pytest tests/ -q

      # The template must never carry anyone's career history: every copy
      # inherits what is committed here. A private instance is *supposed* to
      # have a full profile/, so this step is scoped to the template repo and
      # never fails in a friend's fork. (PRD §19.2)
      - name: Template carries no personal data
        if: endsWith(github.repository, '/jobseeker-template')
        run: python3 bin/check_template_clean.py
